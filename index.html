<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <!-- LEFT : Brand panel -->
  <div class="brand-panel">
    <div class="brand-content">
      <p class="brand-mark">◆</p>
      <h1>STARTUP4NATION</h1>
      <p class="brand-text">Sign in to pick up right where you left off. Your work, your data, your pace.</p>
    </div>
    <p class="brand-footer">&copy; 2026 Your Company</p>
  </div>

  <!-- RIGHT: Login form -->
  <div class="form-panel">
    <div class="form-box">
      <p class="eyebrow">Account access</p>
      <h2>Sign in</h2>
      <p class="sub">Enter your details to continue.</p>

      <form action="#" method="POST">
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="row-between">
          <label class="checkbox-label">
            <input type="checkbox" name="remember">
            Remember me
          </label>
          <a href="#" class="link">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <p class="switch">Don't have an account? <a href="#" class="link">Create one</a></p>
    </div>
  </div>

</div>

</body>
</html>
